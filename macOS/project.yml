name: ZscalerSplitTunnel
options:
  bundleIdPrefix: com.zscaler-split-tunnel
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_VERSION: "6.0"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  ZscalerSplitTunnel:
    type: application
    platform: macOS
    sources:
      - path: ZscalerSplitTunnel
        excludes:
          - "Resources/Info.plist"
          - "Resources/ZscalerSplitTunnel.entitlements"
          - "Resources/Assets.xcassets"
      - path: Shared
    resources:
      - path: ZscalerSplitTunnel/Resources/Assets.xcassets
      - path: ../config
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zscaler-split-tunnel.app
        INFOPLIST_FILE: ZscalerSplitTunnel/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZscalerSplitTunnel/Resources/ZscalerSplitTunnel.entitlements
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 8A7FU99APT
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        PRODUCT_NAME: "Zscaler Split Tunnel"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ZscalerSplitTunnelHelper
        embed: false
      - sdk: Network.framework
      - sdk: ServiceManagement.framework
    postBuildScripts:
      - name: "Copy Helper and Daemon Plist"
        script: |
          set -eu

          app_contents="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents"
          helper_binary="${BUILT_PRODUCTS_DIR}/com.zscaler-split-tunnel.helper"
          if [ ! -f "${helper_binary}" ]; then
            helper_binary="${UNINSTALLED_PRODUCTS_DIR}/macosx/com.zscaler-split-tunnel.helper"
          fi

          mkdir -p "${app_contents}/MacOS"
          cp "${helper_binary}" "${app_contents}/MacOS/"
          mkdir -p "${app_contents}/Library/LaunchDaemons"
          cp "${SRCROOT}/ZscalerSplitTunnelHelper/Launchd.plist" "${app_contents}/Library/LaunchDaemons/com.zscaler-split-tunnel.helper.plist"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/com.zscaler-split-tunnel.helper"
          - "$(UNINSTALLED_PRODUCTS_DIR)/macosx/com.zscaler-split-tunnel.helper"
          - "$(SRCROOT)/ZscalerSplitTunnelHelper/Launchd.plist"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/MacOS/com.zscaler-split-tunnel.helper"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Library/LaunchDaemons/com.zscaler-split-tunnel.helper.plist"
        basedOnDependencyAnalysis: false

  ZscalerSplitTunnelHelper:
    type: tool
    platform: macOS
    sources:
      - path: ZscalerSplitTunnelHelper
        excludes:
          - "*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zscaler-split-tunnel.helper
        INFOPLIST_FILE: ZscalerSplitTunnelHelper/Info.plist
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 8A7FU99APT
        PRODUCT_NAME: com.zscaler-split-tunnel.helper
        SKIP_INSTALL: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        CREATE_INFOPLIST_SECTION_IN_BINARY: "YES"
        OTHER_CODE_SIGN_FLAGS: "-i com.zscaler-split-tunnel.helper"
        SWIFT_OBJC_BRIDGING_HEADER: ZscalerSplitTunnelHelper/BridgingHeader.h
        OTHER_LDFLAGS: ["-sectcreate", "__TEXT", "__launchd_plist", "$(SRCROOT)/ZscalerSplitTunnelHelper/Launchd.plist", "-lpcap"]

  Reset Background Tasks:
    type: tool
    platform: macOS
    sources:
      - path: ResetBackgroundTasks
    settings:
      base:
        PRODUCT_NAME: ResetBackgroundTasks
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    postBuildScripts:
      - name: "Reset Background Task Management"
        script: |
          "${SRCROOT}/Scripts/reset-background-tasks.sh"
        inputFiles:
          - "$(SRCROOT)/Scripts/reset-background-tasks.sh"
        basedOnDependencyAnalysis: false

  ZscalerSplitTunnelHelperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ZscalerSplitTunnelHelperTests
      - path: ZscalerSplitTunnelHelper/ConfigLoader.swift
      - path: ZscalerSplitTunnelHelper/DNSResolver.swift
      - path: ZscalerSplitTunnelHelper/DefaultRouteRepair.swift
      - path: ZscalerSplitTunnelHelper/DNSFlush.swift
      - path: ZscalerSplitTunnelHelper/HelperStatusCache.swift
      - path: ZscalerSplitTunnelHelper/IPValidator.swift
      - path: ZscalerSplitTunnelHelper/RemoteRouteFetcher.swift
      - path: ZscalerSplitTunnelHelper/ReconciliationSchedule.swift
      - path: ZscalerSplitTunnelHelper/RouteEngine.swift
      - path: ZscalerSplitTunnelHelper/RouteReset.swift
      - path: ZscalerSplitTunnelHelper/ShellRunner.swift
      - path: Shared/ConfigPaths.swift
      - path: Shared/Constants.swift
      - path: Shared/ProxySettings.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zscaler-split-tunnel.helper.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"

  ZscalerSplitTunnelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ZscalerSplitTunnelTests
      - path: ZscalerSplitTunnel/Services/HelperInstaller.swift
      - path: ZscalerSplitTunnel/Services/NetworkMonitor.swift
      - path: ZscalerSplitTunnel/ViewModels/HelperConnection.swift
      - path: Shared/Constants.swift
      - path: Shared/DiscoveredDeviceInfo.swift
      - path: Shared/XPCProtocol.swift
      - path: Shared/XPCTypes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zscaler-split-tunnel.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
