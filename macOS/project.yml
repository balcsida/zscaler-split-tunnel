name: ZscalerSplitTunnel
options:
  bundleIdPrefix: com.zscaler-split-tunnel
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  ZscalerSplitTunnel:
    type: application
    platform: macOS
    sources:
      - path: ZscalerSplitTunnel
        excludes:
          - "Resources/Info.plist"
          - "Resources/ZscalerSplitTunnel.entitlements"
          - "Resources/Assets.xcassets"
      - path: Shared
    resources:
      - path: ZscalerSplitTunnel/Resources/Assets.xcassets
      - path: ../config
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zscaler-split-tunnel.app
        INFOPLIST_FILE: ZscalerSplitTunnel/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZscalerSplitTunnel/Resources/ZscalerSplitTunnel.entitlements
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 8A7FU99APT
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        PRODUCT_NAME: "Zscaler Split Tunnel"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ZscalerSplitTunnelHelper
        embed: false
      - sdk: Network.framework
      - sdk: ServiceManagement.framework
    postBuildScripts:
      - name: "Copy Helper and Daemon Plist"
        script: |
          mkdir -p "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Library/LaunchServices"
          cp "${BUILT_PRODUCTS_DIR}/com.zscaler-split-tunnel.helper" "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Library/LaunchServices/"
          mkdir -p "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Library/LaunchDaemons"
          cp "${SRCROOT}/ZscalerSplitTunnelHelper/Launchd.plist" "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Library/LaunchDaemons/com.zscaler-split-tunnel.helper.plist"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/com.zscaler-split-tunnel.helper"
          - "$(SRCROOT)/ZscalerSplitTunnelHelper/Launchd.plist"
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Library/LaunchServices/com.zscaler-split-tunnel.helper"
          - "$(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Library/LaunchDaemons/com.zscaler-split-tunnel.helper.plist"
        basedOnDependencyAnalysis: false

  ZscalerSplitTunnelHelper:
    type: tool
    platform: macOS
    sources:
      - path: ZscalerSplitTunnelHelper
        excludes:
          - "*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zscaler-split-tunnel.helper
        INFOPLIST_FILE: ZscalerSplitTunnelHelper/Info.plist
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 8A7FU99APT
        PRODUCT_NAME: com.zscaler-split-tunnel.helper
        SKIP_INSTALL: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        CREATE_INFOPLIST_SECTION_IN_BINARY: "YES"
        OTHER_CODE_SIGN_FLAGS: "-i com.zscaler-split-tunnel.helper"
        SWIFT_OBJC_BRIDGING_HEADER: ZscalerSplitTunnelHelper/BridgingHeader.h
        OTHER_LDFLAGS: ["-sectcreate", "__TEXT", "__launchd_plist", "$(SRCROOT)/ZscalerSplitTunnelHelper/Launchd.plist", "-lpcap"]

  ZscalerSplitTunnelHelperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ZscalerSplitTunnelHelperTests
      - path: ZscalerSplitTunnelHelper/DefaultRouteRepair.swift
      - path: ZscalerSplitTunnelHelper/RouteEngine.swift
      - path: ZscalerSplitTunnelHelper/RouteReset.swift
      - path: ZscalerSplitTunnelHelper/ShellRunner.swift
      - path: Shared/Constants.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zscaler-split-tunnel.helper.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"

  ZscalerSplitTunnelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ZscalerSplitTunnelTests
      - path: ZscalerSplitTunnel/Services/HelperInstaller.swift
      - path: Shared/Constants.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zscaler-split-tunnel.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
