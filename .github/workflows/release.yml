name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update BuildInfo.swift
        run: |
          SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          cat > macOS/Shared/BuildInfo.swift << EOF
          // Auto-generated by build script. Do not edit manually.
          enum BuildInfo {
              static let gitCommitSHA = "$SHA"
              static let buildDate = "$DATE"
          }
          EOF

      - name: Build
        run: |
          xcodebuild build \
            -project macOS/ZscalerSplitTunnel.xcodeproj \
            -scheme ZscalerSplitTunnel \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create DMG
        id: dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_PATH="build/Build/Products/Release/Zscaler Split Tunnel.app"
          DMG_NAME="ZscalerSplitTunnel-${VERSION}.dmg"

          mkdir -p dmg_staging
          cp -R "$APP_PATH" dmg_staging/
          hdiutil create -volname "Zscaler Split Tunnel" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "$DMG_NAME"

          SHA256=$(shasum -a 256 "$DMG_NAME" | awk '{print $1}')
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="${{ steps.dmg.outputs.dmg_name }}"
          gh release create "$GITHUB_REF_NAME" "$DMG_NAME" \
            --title "v${VERSION}" \
            --generate-notes

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.dmg.outputs.sha256 }}"
          gh api repos/balcsida/homebrew-tap/dispatches \
            -f event_type=update-zscaler-split-tunnel \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[sha256]=$SHA256"
